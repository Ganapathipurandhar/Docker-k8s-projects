apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web-application
  labels:
    app: python-web-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-web-application
  template:
    metadata:
      labels:
        app: python-web-application
    spec:
      containers:
      - name: python-web-app
        image: gpurandhar/python-web-app:v1
        ports:
        - containerPort: 8000

